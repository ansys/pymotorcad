version: 2
updates:
  - package-ecosystem: "pip"
    cooldown:
      default-days: 10 # Fallback cooldown if no specific rule applies
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "maintenance"
      - "dependencies"
    assignees: 
      - "pyansys-ci-bot"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 10 # Fallback cooldown if no specific rule applies
      exclude:
        - "ansys/actions/*"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "maintenance"
    assignees: 
      - "pyansys-ci-bot"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "ansys/pre-commit-hooks/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "chore(pre-commit)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    assignees:
      - "matthewAnsys"
