name: Nightly MotorCAD check

on:
  workflow_dispatch:
  schedule:  # UTC at 0400
    - cron:  '0 22 * * *'

env:
  PACKAGE_NAME: ansys-motorcad-core
  PACKAGE_NAMESPACE: ansys.motorcad.core
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    name: Tests and coverage
    runs-on: [self-hosted, pymotorcad, tests]
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Bootstrap from the PSF-published wheel and hash: an index-based upgrade
      # would still rely on the old pip's compromised CA bundle.
      - name: "Bootstrap pip with a safe certificate bundle"
        shell: bash
        run: |
          python -m pip --disable-pip-version-check install --no-cache-dir --force-reinstall "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade tox tox-gh-actions certifi
          
      - name: Test with tox
        run: tox
